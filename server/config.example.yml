host: 0.0.0.0
port: 8000

# WebUI 管理后台登录凭据（请修改默认密码）
admin:
  username: admin
  password: change-me

# 机器授权密钥白名单：客户端按机器 ID 生成的 XXXX-XXXX-XXXX-XXXX
# 也可通过 WebUI 管理后台增删
keys: []

# 客户端更新检查（与授权服务器合并）
# version 大于客户端版本时提示更新；url 指向安装包（放到 server/downloads/ 目录，
# 文件名含空格时用 %20 编码）；notes 为更新日志（按 `# 版本号` 分组支持多版本），
# size 为安装包字节数
update:
  version: 1.1.0
  url: http://47.122.127.107:8000/downloads/SPlayer%20Together-1.1.0-x64-setup.exe
  notes: |
    # 1.1.0
    - 一起听全面重构：昵称固定、同步更快、播放列表顺序修复、权限逐成员设置
    - 修复成员有权限但无法操作的问题
    - 获权成员操作时广播给全员，无权限成员强制跟随
    - 播放模式同步、移交房主修复、房间解散通知

    # 1.0.3
    - 更新日志改为由服务器按版本提供，支持多版本聚合显示
    - 修复一起听切歌同步与登录限制
    - 修复首次启动显示未知账号问题
  size: 0
