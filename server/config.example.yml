host: 0.0.0.0
port: 8000

# WebUI 管理后台登录凭据（请修改默认密码）
admin:
  username: admin
  password: change-me

# 机器授权密钥白名单：客户端按机器 ID 生成的 XXXX-XXXX-XXXX-XXXX
# 也可通过 WebUI 管理后台增删
keys: []

# 客户端更新检查（与授权服务器合并）
# version 大于客户端版本时提示更新；url 指向安装包（放到 server/downloads/ 目录，
# 文件名含空格时用 %20 编码）；notes 为更新日志，size 为安装包字节数
update:
  version: 1.0.2
  url: http://47.122.127.107:8000/downloads/SPlayer%20Together-1.0.2-x64-setup.exe
  notes: |
    1.0.2
    - 修复房主切歌后成员未同步到同一首歌的问题
    - 修复弹出列表按钮点击穿透问题，菜单项过渡动画
  size: 0
