# 文件名含空格时用 %20 编码）；notes 为更新日志，size 为安装包字节数
update:
  version: 1.0.0
  url: http://47.122.127.107:8000/downloads/SPlayer%20Together-1.0.0-x64-setup.exe
  notes: |
    1.0.0
    - 全新 SPlayer Together：跨平台桌面音乐播放器
    - 新增「一起听」：创建/加入房间，播放列表与播放状态实时同步（纯 HTTP 轮询）
    - 新增机器授权：按机器 ID 生成密钥，管理员加入白名单后可用（每 5 分钟复核）
    - 新增中继服务器 WebUI 管理后台：管理密钥白名单、房间与更新配置
    - 构建产物全量混淆
    - 更新检查迁移至自有服务器，不再依赖 GitHub
