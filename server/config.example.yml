host: 0.0.0.0
port: 8000

# WebUI 管理后台登录凭据（请修改默认密码）
admin:
  username: admin
  password: change-me

# 机器授权密钥白名单：客户端按机器 ID 生成的 XXXX-XXXX-XXXX-XXXX
# 也可通过 WebUI 管理后台增删
keys: []

# 客户端更新检查（与授权服务器合并）
# version 大于客户端版本时提示更新；url 指向安装包（放到 server/downloads/ 目录，
# 文件名含空格时用 %20 编码）；notes 为更新日志，size 为安装包字节数
update:
  version: 1.0.1
  url: http://47.122.127.107:8000/downloads/SPlayer%20Together-1.0.1-x64-setup.exe
  notes: |
    1.0.1
    - 一起听支持协作：成员也能更新播放列表与播放状态，房主可控制成员权限
    - 加入房间后播放列表自动与房主同步，成员间共享同一进度（同步更快更准）
    - 房主可将房主身份移交给其他成员
    - 未连接授权服务器时不再锁定，仅提示；连续离线 1 小时自动退出
    - 授权前强制检查更新，有新版本必须先更新才能使用
    - 关于页新增「查看更新日志」
  size: 0
